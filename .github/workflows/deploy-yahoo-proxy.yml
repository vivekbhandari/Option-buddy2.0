name: Deploy Yahoo proxy (Cloudflare Worker)

on:
  push:
    branches: ["main"]
    paths:
      - "yahoo-proxy/**"
      - ".github/workflows/deploy-yahoo-proxy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "yahoo-proxy"
          command: deploy
